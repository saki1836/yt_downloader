<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; text-align: center; padding: 15px; }
        .main-card { background: #1e1e1e; max-width: 450px; margin: 0 auto; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 14px; border-radius: 10px; border: none; margin-bottom: 15px; background: #2a2a2a; color: white; font-size: 16px; outline: none; }
        button { background: #ff0000; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        #player-container { display: none; margin-top: 25px; border-top: 1px solid #333; padding-top: 20px; }
        video { width: 100%; border-radius: 12px; margin-bottom: 15px; background: black; }
        select { width: 100%; padding: 12px; border-radius: 10px; background: #2a2a2a; color: white; border: 1px solid #444; margin-bottom: 15px; }
        .p-wrapper { display: none; margin-top: 20px; }
        .p-container { background: #333; border-radius: 10px; height: 12px; overflow: hidden; margin-top: 10px; width: 100%; }
        .p-bar { width: 0%; height: 100%; background: #ffcc00; transition: width 0.4s ease; box-shadow: 0 0 10px #ffcc00; }
        .p-text { font-size: 14px; color: #ffcc00; font-weight: bold; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="main-card">
        <h2>YT Downloader</h2>
        <input type="text" id="videoUrl" placeholder="Paste link here...">
        <button onclick="getPreview()">Analyze Video</button>
        
        <div id="loading" style="display:none; color:#aaa; margin-top:10px;">Searching... 🔍</div>

        <div id="player-container">
            <h4 id="vTitle" style="font-size: 14px; margin-bottom: 15px; font-weight: normal;"></h4>
            <video id="myPlayer" controls></video>
            
            <select id="qualitySelect">
                <option value="fullhd">Full HD (1080p MP4)</option>
                <option value="medium">HD (720p MP4)</option>
                <option value="low">SD (360p MP4)</option>
                <option value="mp3">Audio (MP3)</option>
            </select>
            
            <button id="downloadBtn" style="background: #28a745;">Download Now</button>

            <div class="p-wrapper" id="pWrap">
                <div class="p-text">
                    <span id="pLabel">Downloading...</span>
                    <span id="pPercent">0%</span>
                </div>
                <div class="p-container"><div class="p-bar" id="pBar"></div></div>
            </div>
        </div>
    </div>

    <script>
        async function getPreview() {
            const url = document.getElementById('videoUrl').value;
            if(!url) return alert("Paste link!");
            document.getElementById('loading').style.display = 'block';
            document.getElementById('player-container').style.display = 'none';

            try {
                const response = await fetch('/get_info', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `url=${encodeURIComponent(url)}`
                });
                const data = await response.json();
                if(data.error) throw new Error(data.error);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('player-container').style.display = 'block';
                document.getElementById('vTitle').innerText = data.title;
                document.getElementById('myPlayer').src = data.video_url;

                document.getElementById('downloadBtn').onclick = () => runDownload(url);
            } catch (err) {
                alert("Error: " + err.message);
                document.getElementById('loading').style.display = 'none';
            }
        }

        function runDownload(url) {
            const q = document.getElementById('qualitySelect').value;
            document.getElementById('pWrap').style.display = 'block';
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) clearInterval(interval);
                else {
                    width += (100 - width) * 0.05;
                    document.getElementById('pBar').style.width = width + '%';
                    document.getElementById('pPercent').innerText = Math.floor(width) + "%";
                }
            }, 400);
            window.location.href = `/download?url=${encodeURIComponent(url)}&quality=${q}`;
        }
    </script>
</body>
</html>
